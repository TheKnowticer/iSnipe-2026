// Development only: stock S&D settings and this is NOT the requested mod.
// Execute after your normal server configuration. These values need live testing.
set sv_hostname "^2iSnipe2026 ^7S&D ^3| ^7MapVote ^3| ^7Leaderboard"
set scr_sd_winlimit "5"
set scr_sd_roundlimit "0"
set scr_sd_roundswitch "1"
set scr_sd_timelimit "10"
set scr_sd_numlives "1"
set scr_sd_planttime "5"
set scr_sd_defusetime "5"
set scr_sd_bombtimer "45"
set scr_team_fftype "0"

// Earned, manually activated stock radar streaks only.
set scr_game_hardpoints "1"
set scr_game_forceuav "0"
set isnipe_uav_kills "3"
set isnipe_counter_uav_kills "4"

// Suppress fall damage for the test server.

// Maximum continuous time fully aimed down sights, in seconds.
set isnipe_ads_limit "0.06"



// Installed map pool for voting; unavailable entries are filtered at startup.
set sv_votemaps "afghan,bailout,bloc,bog,carnival,chemicalplant,crash,crashtropical,crossfire,derail,estate,estatetropical,favela,favelatropical,firingrange,forgottencity,freighter,fuel,highrise,invasion,karachi,killhouse,nuketown,overgrown,quarry,rundown,rust,rustlong,salvage,scrapyard,shipmentlong,skidrow,storm,strike,subbase,terminal,trailerpark,underpass,vacant,wasteland,wetwork,downpour,backlot,pipeline,countdown,crashsnow,chinatown,mp_ambush_sh"

// Movement adjustments.
set isnipe_move_scale "1.05"

set player_sprintUnlimited 0



// Stationary radar ping: seconds stationary, movement tolerance, repeat interval.
set isnipe_camp_time "15"
set isnipe_camp_radius "12"
set isnipe_camp_ping_interval "5"

// Experimental red-dot overlay; set to 0 to use the previous firing-event ping.
// X and Y are the minimap centre in 640x480 HUD coordinates; size is its width.
set isnipe_camp_overlay "1"
set isnipe_radar_x "55"
set isnipe_radar_y "55"
set isnipe_radar_size "100"
set isnipe_radar_range "2500"
set isnipe_radar_dot_time "1.5"

// Persistent leaderboard: include human kills against test bots (1) or exclude them (0).
set isnipe_lb_count_bot_kills "1"

// Killfeed position in adjustable HUD coordinates, just right of the minimap.
set isnipe_killfeed_enabled "1"
set isnipe_killfeed_x "115"
set isnipe_killfeed_y "8"
set isnipe_killfeed_time "5"

// Temporary test clients per team. Set to 0 and restart to disable.
set isnipe_testbots_per_team 0
set testClients_doMove 0
set testClients_doAttack 0

// Temporary radar diagnostics
set com_logFilter 0

set developer_script 1

// Shared scheduled announcements and individual welcome messages.
exec isnipe-announcements.cfg
exec isnipe-panel-rcon.cfg
