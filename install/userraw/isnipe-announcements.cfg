// Common announcement settings for all three servers.
// Changes apply after restarting, or after executing this file on the server.
// ^1 through ^7 are MW2 color codes. {server} and {player} work in welcomes;
// {server} also works in server-wide messages.
set isnipe_announcements_enabled "1"
set isnipe_welcome_delay "5"
set isnipe_welcome_1 "^2Welcome to {server}, {player}!"
set isnipe_welcome_2 "^7Type ^3!lb ^7to view this server's leaderboard."
set isnipe_welcome_3 ""
set isnipe_welcome_4 ""

// Repeating messages: interval in seconds; 0 or an empty message disables a slot.
set isnipe_announce_interval_1 "300"
set isnipe_announce_message_1 "^2iSnipe 2026: ^7Type ^3!lb ^7to see the top players."
set isnipe_announce_interval_2 "0"
set isnipe_announce_message_2 ""
set isnipe_announce_interval_3 "0"
set isnipe_announce_message_3 ""
set isnipe_announce_interval_4 "0"
set isnipe_announce_message_4 ""
set isnipe_announce_interval_5 "0"
set isnipe_announce_message_5 ""

// Daily announcements use the host computer's local 24-hour time (HH:MM).
// Example: set isnipe_daily_time_1 "18:30" and supply a message below.
set isnipe_daily_time_1 ""
set isnipe_daily_message_1 ""
set isnipe_daily_time_2 ""
set isnipe_daily_message_2 ""
set isnipe_daily_time_3 ""
set isnipe_daily_message_3 ""
set isnipe_daily_time_4 ""
set isnipe_daily_message_4 ""
set isnipe_daily_time_5 ""
set isnipe_daily_message_5 ""
